# DigitalOcean App Platform spec: the static game site plus a serverless "api" component.
# Both redeploy on every push to main. Create the app from this file
# (doctl apps create --spec .do/app.yaml) or paste the functions + ingress sections into the
# App Platform "App Spec" editor of an existing app.
name: the-open-space
region: nyc
static_sites:
  - name: web
    github:
      repo: shahidfoy/TheOpenSpace
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    output_dir: dist
    catchall_document: index.html
functions:
  # cyber-threat aggregator (functions/packages/threats/feed) → /api/threats/feed
  - name: api
    github:
      repo: shahidfoy/TheOpenSpace
      branch: main
      deploy_on_push: true
    source_dir: /functions
    # Optional threat-feed keys (functions/project.yml passes them to the function). Add the ones
    # you have as encrypted variables, in the console or here, e.g.:
    # envs:
    #   - key: ABUSECH_KEY
    #     type: SECRET
    #     scope: RUN_AND_BUILD_TIME
    #     value: <set in the console, never commit a real key>
    # Others: OTX_KEY, CLOUDFLARE_RADAR_TOKEN, ABUSEIPDB_KEY, NVD_API_KEY. Each must also be listed
    # in functions/project.yml, and only once it is set here: an unset one fails the build.
ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /api
    - component:
        name: web
      match:
        path:
          prefix: /
