# DigitalOcean Functions project, deployed as the "api" component of the App Platform app
# (see .do/app.yaml). Functions are served at /api/threats/feed and /api/weather/storms on the
# game's own domain.
#
# Optional threat-feed keys reach the function through the environment block below. App Platform
# checks every dollar-brace reference in this file (comments included) against the api
# component's environment variables and fails the build if one isn't set. So list only keys that
# exist (App Platform → api → Settings → Environment Variables, encrypted, run and build time).
# To switch on another source, set its variable there, then add a line below in the same form as
# the Cloudflare one, named: ABUSECH_KEY (abuse.ch), OTX_KEY (AlienVault OTX), ABUSEIPDB_KEY
# (AbuseIPDB) or NVD_API_KEY (higher NVD rate limit).
packages:
  - name: threats
    environment:
      CLOUDFLARE_RADAR_TOKEN: "${CLOUDFLARE_RADAR_TOKEN}"
    functions:
      - name: feed
        runtime: nodejs:18
        web: true
        limits:
          timeout: 45000
          memory: 512
  # active tropical cyclones (GDACS + NOAA NHC) for Earth weather → /api/weather/storms
  - name: weather
    functions:
      - name: storms
        runtime: nodejs:18
        web: true
        limits:
          timeout: 30000
          memory: 256
