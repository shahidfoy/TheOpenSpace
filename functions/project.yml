# DigitalOcean Functions project, deployed as the "api" component of the App Platform app
# (see .do/app.yaml). The function is served at /api/threats/feed on the game's own domain.
#
# Optional threat-feed keys reach the function through the environment block below. The build
# substitutes each ${NAME} from the api component's environment variables and FAILS if one isn't
# set, so list only keys that exist (App Platform → api → Settings → Environment Variables,
# encrypted). To switch on another source, set its variable there, then add its line here:
#   ABUSECH_KEY: "${ABUSECH_KEY}"            abuse.ch URLhaus + ThreatFox
#   OTX_KEY: "${OTX_KEY}"                    AlienVault OTX
#   ABUSEIPDB_KEY: "${ABUSEIPDB_KEY}"        AbuseIPDB
#   NVD_API_KEY: "${NVD_API_KEY}"            higher NVD rate limit
packages:
  - name: threats
    environment:
      CLOUDFLARE_RADAR_TOKEN: "${CLOUDFLARE_RADAR_TOKEN}"
    functions:
      - name: feed
        runtime: nodejs:18
        web: true
        limits:
          timeout: 45000
          memory: 512
